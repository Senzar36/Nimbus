<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMBUS | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .member-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 1rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.3s ease;
        }

        .member-row:hover {
            border-color: var(--cyan);
            background: rgba(255,255,255,0.06);
        }

        .section-title {
            color: var(--cyan);
            margin: 2rem 0 1rem 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        .remove-btn {
            position: absolute;
            right: -40px;
            top: 15px;
            background: var(--error);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px var(--error);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 15px 0;
            color: var(--text);
        }

        .radio-group label {
            display: inline;
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            color: var(--muted);
            transition: color 0.3s ease;
        }

        .radio-group input:checked + label {
            color: var(--cyan);
            text-shadow: 0 0 5px var(--cyan);
        }
    </style>
</head>

<body>

    <header>
        <h1>NIMBUS</h1>
        <p>Join the Storm</p>
    </header>

    <div class="container">
        <div class="card" style="max-width: 850px; margin: 0 auto;">

            <h2 style="text-align: center; margin-bottom: 0.5rem; color: #fff;">
                Team Registration
            </h2>

            <p style="text-align: center; color: var(--muted); margin-bottom: 2.5rem;">
                Minimum 3 members, Maximum 4 members per team.
            </p>

            <form action="/register" method="POST" id="regForm">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label>Team Name</label>
                    <input
                        type="text"
                        name="team_name"
                        required
                        placeholder="Enter a futuristic team name"
                    >
                </div>

                <div class="section-title">
                    Leader Details
                </div>

                <div
                    class="grid"
                    style="grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 1rem;"
                >

                    <div class="form-group">
                        <label>Full Name</label>
                        <input
                            type="text"
                            name="leader_name"
                            required
                            placeholder="John Doe"
                        >
                    </div>

                    <div class="form-group">
                        <label>College Email</label>
                        <input
                            type="email"
                            name="leader_email"
                            required
                            placeholder="leader@college.edu"
                        >
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input
                            type="text"
                            name="leader_phone"
                            required
                            placeholder="+91 0000000000"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label>Residency Status</label>

                    <div class="radio-group">

                        <input
                            type="radio"
                            id="leader_day"
                            name="leader_status"
                            value="Day Scholar"
                            required
                        >
                        <label for="leader_day">
                            Day Scholar
                        </label>

                        <input
                            type="radio"
                            id="leader_host"
                            name="leader_status"
                            value="Hosteller"
                        >
                        <label for="leader_host">
                            Hosteller
                        </label>

                    </div>
                </div>

                <div class="section-title">
                    Team Members
                </div>

                <div id="members-container">
                    <!-- Member rows added by JS -->
                </div>

                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 2rem;
                    "
                >

                    <button
                        type="button"
                        id="add-member"
                        class="btn"
                        style="
                            background: rgba(255,255,255,0.1);
                            border: 1px solid var(--border);
                        "
                    >
                        + Add Member
                    </button>

                    <span
                        id="member-count"
                        style="
                            color: var(--muted);
                            font-family: monospace;
                        "
                    >
                        Members: 3/4
                    </span>

                </div>

                <button
                    type="submit"
                    class="btn"
                    style="
                        width: 100%;
                        padding: 1.2rem;
                        font-size: 1.1rem;
                    "
                >
                    Register Team & Proceed to Payment
                </button>

            </form>
        </div>
    </div>

    <script>
        const container = document.getElementById('members-container');
        const addBtn = document.getElementById('add-member');
        const countDisplay = document.getElementById('member-count');

        // Leader + 2 members = minimum team size of 3
        let memberCount = 1;

        function updateCount() {
            countDisplay.innerText =
                `Members: ${memberCount}/4 (including leader)`;

            if (memberCount >= 4) {
                addBtn.disabled = true;
                addBtn.style.opacity = '0.3';
                addBtn.style.cursor = 'not-allowed';
            } else {
                addBtn.disabled = false;
                addBtn.style.opacity = '1';
                addBtn.style.cursor = 'pointer';
            }
        }

        function createMemberRow(index) {

            const wrapper = document.createElement('div');

            wrapper.style.marginBottom = '1.5rem';
            wrapper.style.padding = '1.5rem';
            wrapper.style.background = 'rgba(255,255,255,0.03)';
            wrapper.style.borderRadius = '12px';
            wrapper.style.border = '1px solid var(--border)';
            wrapper.style.position = 'relative';
            wrapper.style.transition = 'all 0.3s ease';

            const row = document.createElement('div');

            row.style.display = 'grid';
            row.style.gridTemplateColumns = '1fr 1fr 1fr';
            row.style.gap = '15px';

            row.innerHTML = `
                <input
                    type="text"
                    name="member_name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="member_email"
                    placeholder="college@email.edu"
                    required
                >

                <input
                    type="text"
                    name="member_phone"
                    placeholder="Phone Number"
                    required
                >
            `;

            const statusDiv = document.createElement('div');

            statusDiv.className = 'radio-group';
            statusDiv.style.marginTop = '15px';

            statusDiv.innerHTML = `
                <span
                    style="
                        font-size:0.8rem;
                        color:var(--muted);
                        margin-right:10px;
                        text-transform: uppercase;
                    "
                >
                    Residency:
                </span>

                <input
                    type="radio"
                    name="member_status_${index}"
                    value="Day Scholar"
                    required
                >

                <label>
                    Day Scholar
                </label>

                <input
                    type="radio"
                    name="member_status_${index}"
                    value="Hosteller"
                >

                <label>
                    Hosteller
                </label>
            `;

            const removeBtn = document.createElement('button');

            removeBtn.className = 'remove-btn';
            removeBtn.type = 'button';
            removeBtn.innerHTML = '×';
            removeBtn.type = 'button';

            removeBtn.onclick = function() {
                wrapper.remove();
                memberCount--;
                renumberMembers();
                updateCount();
            };

            wrapper.appendChild(row);
            wrapper.appendChild(statusDiv);
            wrapper.appendChild(removeBtn);

            return wrapper;
        }

        addBtn.onclick = function() {
            if (memberCount < 4) {
                container.appendChild(createMemberRow(memberCount));
                memberCount++;
                renumberMembers();
                updateCount();
            }
        };

        window.onload = function() {
            container.appendChild(createMemberRow(1));
            memberCount++;

            container.appendChild(createMemberRow(2));
            memberCount++;

            renumberMembers();
            updateCount();
        };

        document.getElementById('regForm').onsubmit = function(e) {

            if (memberCount < 3) {

                alert(
                    'You must have at least 3 members in a team (including the leader).'
                );

                e.preventDefault();

                return false;
            }

            return true;
        };
    </script>

</body>
</html>
