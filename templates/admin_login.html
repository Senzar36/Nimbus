<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIMBUS | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #080b14;
            --surface: #111827;
            --surface-light: #182132;
            --border: #263247;
            --text: #f4f7fb;
            --muted: #8f9bb0;
            --cyan: #00f5ff;
            --purple: #8b5cf6;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(0, 245, 255, 0.08),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(139, 92, 246, 0.08),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            padding: 1.5rem;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        /* Branding */

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            margin: 0;

            font-size: 3rem;
            letter-spacing: 4px;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(0, 245, 255, 0.5),
                0 0 25px rgba(0, 245, 255, 0.2);
        }

        .brand p {
            margin: 0.6rem 0 0;

            color: var(--muted);

            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Login Card */

        .login-card {
            background: rgba(17, 24, 39, 0.92);

            border: 1px solid var(--border);
            border-radius: 18px;

            padding: 2.5rem;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(0, 245, 255, 0.04);

            backdrop-filter: blur(12px);
        }

        .login-card h2 {
            margin: 0 0 0.5rem;

            font-size: 1.5rem;

            color: #ffffff;
        }

        .login-card .subtitle {
            margin: 0 0 2rem;

            color: var(--muted);

            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Form */

        .form-group {
            margin-bottom: 1.3rem;
        }

        .form-group label {
            display: block;

            margin-bottom: 0.5rem;

            color: #dbe2ed;

            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 0.9rem 1rem;

            background: #0b1220;

            border: 1px solid var(--border);
            border-radius: 9px;

            color: var(--text);

            font-size: 0.95rem;

            outline: none;

            transition: 0.2s ease;
        }

        .form-group input::placeholder {
            color: #5f6b7d;
        }

        .form-group input:focus {
            border-color: var(--cyan);

            box-shadow:
                0 0 0 3px rgba(0, 245, 255, 0.08),
                0 0 15px rgba(0, 245, 255, 0.08);
        }

        /* Login Button */

        .login-btn {
            width: 100%;

            margin-top: 0.5rem;

            padding: 0.9rem 1rem;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                135deg,
                var(--cyan),
                #5b8cff
            );

            color: #061018;

            font-size: 0.95rem;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(0, 245, 255, 0.18);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Footer */

        .login-footer {
            text-align: center;

            margin-top: 1.5rem;

            color: #5f6b7d;

            font-size: 0.75rem;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .brand h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">
            <h1>NIMBUS</h1>
            <p>ADMIN CONTROL PANEL</p>
        </div>

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Sign in to manage registrations, teams, and event operations.
            </p>

            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign In
                </button>

            </form>

        </div>

        <div class="login-footer">
            NIMBUS 2026 • Admin Access
        </div>

    </div>

</body>
</html>
